[project]
name = "claire-ai"
version = "0.1.2"
description = "An assistent with AI of your choice in your terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.15",
    "python-dotenv>=1.2.3",
    "typer>=0.27.1",
]

[project.scripts]
claire-ai = "claire_ai.main:app"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
